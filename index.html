<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>100-Day Game – 3D Prototype</title>
<style>
  body { margin: 0; overflow: hidden; background: black; }
  #ui {
    position: fixed;
    top: 10px;
    left: 10px;
    color: white;
    font-family: monospace;
    z-index: 10;
  }
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    color: white;
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: monospace;
    font-size: 24px;
    z-index: 20;
  }
</style>
</head>
<body>

<div id="ui">
  Day: <span id="day">1</span><br>
  Time: <span id="time">60</span><br>
  Missions: <span id="missions">0</span><br>
  Insanity: <span id="insanity">0%</span>
</div>

<div id="overlay"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
/* ---------- BASIC SETUP ---------- */
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 10, 60);

const camera = new THREE.PerspectiveCamera(
  75, window.innerWidth / window.innerHeight, 0.1, 1000
);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

/* ---------- LIGHTING ---------- */
scene.add(new THREE.AmbientLight(0x404040));

const moonLight = new THREE.DirectionalLight(0x8899ff, 0.8);
moonLight.position.set(5, 10, 2);
scene.add(moonLight);

/* ---------- FLOOR (10x10 tiles) ---------- */
const floorGroup = new THREE.Group();
const tileSize = 5;

for (let x = -5; x < 5; x++) {
  for (let z = -5; z < 5; z++) {
    const tile = new THREE.Mesh(
      new THREE.BoxGeometry(tileSize, 0.2, tileSize),
      new THREE.MeshStandardMaterial({ color: 0x1a1a2a })
    );
    tile.position.set(x * tileSize, 0, z * tileSize);
    floorGroup.add(tile);
  }
}
scene.add(floorGroup);

/* ---------- PLAYER ---------- */
const player = {
  pos: new THREE.Vector3(0, 1.7, 0),
  vel: new THREE.Vector3(),
  speed: 0.12,
  yaw: 0,
  pitch: 0
};
camera.position.copy(player.pos);

/* ---------- MISSIONS ---------- */
let missions = [];
function spawnMissions(count) {
  missions.forEach(m => scene.remove(m));
  missions = [];

  for (let i = 0; i < count; i++) {
    const cube = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshStandardMaterial({
        color: 0x66ccff,
        emissive: 0x223355
      })
    );
    cube.position.set(
      (Math.random() * 40) - 20,
      1,
      (Math.random() * 40) - 20
    );
    scene.add(cube);
    missions.push(cube);
  }
}

/* ---------- GAME STATE ---------- */
let day = 1;
let timeLeft = 60;
let insanity = 0;
let keys = {};
const overlay = document.getElementById("overlay");

/* ---------- INPUT ---------- */
document.addEventListener("click", () => {
  document.body.requestPointerLock();
});

document.addEventListener("mousemove", e => {
  if (document.pointerLockElement) {
    player.yaw -= e.movementX * 0.002;
    player.pitch -= e.movementY * 0.002;
    player.pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, player.pitch));
  }
});

document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

/* ---------- NIGHT LOOP ---------- */
function startNight() {
  timeLeft = 60;
  insanity = 0;
  spawnMissions(3 + Math.floor(day / 3));
  overlay.style.display = "none";
}

function endNight(success) {
  overlay.style.display = "flex";
  overlay.innerHTML = success
    ? `Day ${day} Complete<br><small>The school looks normal.</small>`
    : `You Dissolve Into Shadows`;

  if (success && day < 24) day++;

  setTimeout(startNight, 2500);
}

/* ---------- UPDATE ---------- */
function updatePlayer() {
  const dir = new THREE.Vector3();
  if (keys["w"]) dir.z -= 1;
  if (keys["s"]) dir.z += 1;
  if (keys["a"]) dir.x -= 1;
  if (keys["d"]) dir.x += 1;

  dir.normalize();
  dir.applyAxisAngle(new THREE.Vector3(0,1,0), player.yaw);

  const speed = player.speed * (1 - insanity / 150);
  player.pos.addScaledVector(dir, speed);

  camera.position.copy(player.pos);
  camera.rotation.set(player.pitch, player.yaw, 0);
}

function updateInsanity() {
  insanity = Math.min(insanity + 0.05, 100);
  camera.fov = 75 + Math.sin(performance.now() * 0.002) * insanity * 0.1;
  camera.updateProjectionMatrix();
}

function checkMissions() {
  missions = missions.filter(m => {
    if (m.position.distanceTo(player.pos) < 1.5) {
      scene.remove(m);
      return false;
    }
    return true;
  });
}

function updateUI() {
  dayEl.textContent = day;
  timeEl.textContent = timeLeft;
  missionsEl.textContent = missions.length;
  insanityEl.textContent = Math.floor(insanity) + "%";
}

/* ---------- TIMER ---------- */
setInterval(() => {
  timeLeft--;
  if (timeLeft <= 0) {
    endNight(missions.length === 0);
  }
}, 1000);

/* ---------- MAIN LOOP ---------- */
function animate() {
  updatePlayer();
  updateInsanity();
  checkMissions();
  updateUI();

  if (missions.length === 0) {
    endNight(true);
  }

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

/* ---------- INIT ---------- */
const dayEl = document.getElementById("day");
const timeEl = document.getElementById("time");
const missionsEl = document.getElementById("missions");
const insanityEl = document.getElementById("insanity");

startNight();
animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
