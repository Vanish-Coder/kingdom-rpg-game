<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>100-Day Game – Prototype</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0b0b0f;
    overflow: hidden;
    font-family: monospace;
    color: white;
  }

  #ui {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 10;
    font-size: 14px;
  }

  #game {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
    filter: blur(0px);
    transition: filter 0.2s;
  }

  /* Fake vignette */
  #vignette {
    pointer-events: none;
    position: fixed;
    inset: 0;
    background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.8) 100%);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .player {
    position: absolute;
    width: 30px;
    height: 40px;
    background: #eaeaea;
    border-radius: 6px;
    transform-origin: bottom center;
    box-shadow: 0 10px 0 rgba(0,0,0,0.3);
  }

  .mission {
    position: absolute;
    width: 24px;
    height: 24px;
    background: #6cf;
    border-radius: 4px;
    box-shadow: 0 6px 0 rgba(0,0,0,0.3);
  }

  .floor {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(#151520 1px, transparent 1px),
      linear-gradient(90deg, #151520 1px, transparent 1px);
    background-size: 40px 40px;
  }

  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    text-align: center;
    z-index: 20;
    display: none;
  }
</style>
</head>
<body>

<div id="ui">
  <div>Day: <span id="day">1</span></div>
  <div>Time Left: <span id="time">60</span></div>
  <div>Missions Left: <span id="missions">0</span></div>
  <div>Insanity: <span id="insanity">0%</span></div>
</div>

<div id="game">
  <div class="floor"></div>
  <div id="player" class="player"></div>
</div>

<div id="vignette"></div>
<div id="overlay"></div>

<script>
const game = document.getElementById("game");
const playerEl = document.getElementById("player");
const vignette = document.getElementById("vignette");
const overlay = document.getElementById("overlay");

let day = 1;
let timeLeft = 60;
let insanity = 0;
let missions = [];
let keys = {};

const player = {
  x: window.innerWidth / 2,
  y: window.innerHeight / 2,
  speed: 2.2
};

function spawnMissions(count) {
  missions.forEach(m => m.el.remove());
  missions = [];

  for (let i = 0; i < count; i++) {
    const el = document.createElement("div");
    el.className = "mission";
    const x = Math.random() * (window.innerWidth - 50) + 25;
    const y = Math.random() * (window.innerHeight - 80) + 40;
    el.style.left = x + "px";
    el.style.top = y + "px";
    game.appendChild(el);
    missions.push({ x, y, el });
  }
}

function startNight() {
  timeLeft = 60;
  insanity = 0;
  spawnMissions(3 + Math.floor(day / 3));
  overlay.style.display = "none";
}

function endNight(success) {
  overlay.style.display = "flex";
  overlay.innerHTML = success
    ? `Day ${day} Complete<br><small>The school looks normal.</small>`
    : `You Dissolve Into Shadows<br><small>Try again.</small>`;

  if (success) day++;

  setTimeout(startNight, 2500);
}

function updatePlayer() {
  let dx = 0, dy = 0;
  if (keys["w"] || keys["ArrowUp"]) dy--;
  if (keys["s"] || keys["ArrowDown"]) dy++;
  if (keys["a"] || keys["ArrowLeft"]) dx--;
  if (keys["d"] || keys["ArrowRight"]) dx++;

  const speed = player.speed * (1 - insanity / 150);
  player.x += dx * speed;
  player.y += dy * speed;

  player.x = Math.max(0, Math.min(window.innerWidth - 30, player.x));
  player.y = Math.max(0, Math.min(window.innerHeight - 40, player.y));

  const scale = 0.9 + (player.y / window.innerHeight) * 0.2;
  playerEl.style.transform = `scale(${scale})`;
  playerEl.style.left = player.x + "px";
  playerEl.style.top = player.y + "px";
}

function checkMissions() {
  missions = missions.filter(m => {
    const dist = Math.hypot(player.x - m.x, player.y - m.y);
    if (dist < 30) {
      m.el.remove();
      return false;
    }
    return true;
  });

  document.getElementById("missions").textContent = missions.length;
}

function updateInsanity() {
  insanity += 0.08;
  insanity = Math.min(insanity, 100);

  document.getElementById("insanity").textContent =
    Math.floor(insanity) + "%";

  game.style.filter = `blur(${insanity / 25}px)`;
  vignette.style.opacity = insanity / 120;
}

function updateTimer() {
  timeLeft -= 1;
  document.getElementById("time").textContent = timeLeft;

  if (timeLeft <= 0) {
    endNight(missions.length === 0);
  }
}

function gameLoop() {
  updatePlayer();
  checkMissions();
  updateInsanity();

  if (missions.length === 0) {
    endNight(true);
  }

  requestAnimationFrame(gameLoop);
}

document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

setInterval(updateTimer, 1000);
startNight();
gameLoop();
</script>

</body>
</html>
